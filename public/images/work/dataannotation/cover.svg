<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DataAnnotation cover</title>
  <desc id="desc">Abstract code review and testing cover for the DataAnnotation card.</desc>
  <rect width="1200" height="760" fill="#0b0f14"/>
  <circle cx="980" cy="130" r="260" fill="#25345c" opacity=".55"/>
  <circle cx="190" cy="650" r="300" fill="#1c4d3a" opacity=".32"/>
  <rect x="92" y="88" width="1016" height="584" rx="36" fill="#101820" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="142" y="168" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="800">AI CODE REVIEW</text>
  <text x="142" y="212" fill="#80ffbf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">TESTS / EDGE CASES / DEBUGGING</text>
  <g transform="translate(142 282)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">
    <text y="0" fill="#7dd3fc">function</text>
    <text x="150" y="0" fill="#f8fafc">validateAnswer(answer) {</text>
    <text x="44" y="58" fill="#a7f3d0">expect</text>
    <text x="166" y="58" fill="#f8fafc">(logic).toHandle(edgeCases)</text>
    <text x="44" y="116" fill="#facc15">review</text>
    <text x="158" y="116" fill="#f8fafc">requirements, runtime, tests</text>
    <text y="174" fill="#f8fafc">}</text>
  </g>
  <g fill="none" stroke="#80ffbf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m802 470 56 56 128-154"/>
  </g>
</svg>
